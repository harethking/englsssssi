l12 12"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>'};

  const levels=[
    {id:'A1',name:'مبتدئ',en:'Beginner',desc:'ابدأ من الصفر: الحروف، الكلمات الأولى، والجمل البسيطة.',lessons:[
      ['حروف الإنجليزية وأصواتها','تعرّف إلى الأبجدية وأصوات الحروف الأساسية.','تتكوّن الأبجدية الإنجليزية من 26 حرفاً. تعلّم اسم الحرف وصوته يساعدك على قراءة الكلمات الجديدة.',[['letter','حرف'],['sound','صوت'],['alphabet','الأبجدية'],['name','اسم']],'How many letters are in the English alphabet?',['20','26','30'],1],
      ['التحية والتعارف','قل مرحباً، عرّف بنفسك، واسأل عن الاسم.','استخدم I am أو I’m للتعريف بنفسك: I am Sara. / I’m Sara.',[['hello','مرحباً'],['name','اسم'],['meet','أقابل'],['please','من فضلك']],'اختر الجملة الصحيحة للتعريف بنفسك.',['I am name Sara.','I Sara am.','I am Sara.'],2],
      ['الضمائر وفعل be','استخدم am و is و are في جمل قصيرة.','I am، You are، He/She/It is. في السؤال نقدّم الفعل: Are you ready?', [['I','أنا'],['you','أنتَ / أنتِ'],['we','نحن'],['they','هم']],'أكمل: She ___ a student.',['am','is','are'],1],
      ['الأرقام والأعمار','الأعداد من 1 إلى 100 وكيفية ذكر العمر.','نقول العمر مع فعل be: I am twenty years old. والسؤال: How old are you?', [['one','واحد'],['twenty','عشرون'],['hundred','مئة'],['year','سنة']],'كيف تسأل شخصاً عن عمره؟',['How many old are you?','How old are you?','What age you?'],1],
      ['أشيائي والأسماء','سمّ الأشياء حولك واستخدم a و an.','نستخدم a قبل صوت ساكن: a book. ونستخدم an قبل صوت متحرك: an apple.', [['book','كتاب'],['apple','تفاحة'],['phone','هاتف'],['bag','حقيبة']],'اختر الأداة الصحيحة: ___ apple.',['a','an','the'],1]
    ]},
    {id:'A2',name:'أساسي',en:'Elementary',desc:'وسّع مفرداتك وتحدّث عن يومك، عائلتك، واحتياجاتك.',lessons:[
      ['روتيني اليومي','صف يومك واستخدم المضارع البسيط.','نضيف s للفعل مع he/she/it: She works. في النفي: don’t / doesn’t.', [['wake up','أستيقظ'],['breakfast','فطور'],['usually','عادةً'],['evening','مساء']],'أكمل: He ___ to work every day.',['go','goes','going'],1],
      ['العائلة والصفات','تحدّث عن أفراد عائلتك وصفاتهم.','صفات الملكية: my, your, his, her, our, their. تأتي قبل الاسم: my sister.', [['family','عائلة'],['sister','أخت'],['kind','لطيف'],['together','معاً']],'اختر: This is ___ brother. (أنا أتحدث عن أخي)',['my','me','I'],0],
      ['الطعام والطلبات','اطلب طعاماً بأدب في مقهى أو مطعم.','Could I have…? طلب مهذب. Some في الجمل المثبتة و any غالباً في السؤال والنفي.', [['menu','قائمة الطعام'],['water','ماء'],['delicious','لذيذ'],['order','يطلب']],'أي طلب أكثر تهذيباً؟',['Give water.','Could I have some water, please?','I want water now.'],1],
      ['الوقت والأيام','اسأل عن الساعة وتحدّث عن مواعيدك.','نستخدم at مع الساعة المحددة: at 7 o’clock، و on مع أيام الأسبوع: on Monday.', [['today','اليوم'],['tomorrow','غداً'],['minute','دقيقة'],['early','مبكراً']],'أكمل: The meeting starts ___ 9 o’clock.',['in','on','at'],2],
      ['الأماكن والاتجاهات','اسأل عن مكان واتبّع إرشادات بسيطة.','Where is…? للمكان. next to بجانب، opposite مقابل، between بين.', [['street','شارع'],['left','يسار'],['near','قريب'],['turn','انعطف']],'ماذا تعني turn left?',['انعطف يميناً','انعطف يساراً','امشِ مباشرةً'],1]
    ]},
    {id:'B1',name:'متوسط',en:'Intermediate',desc:'احكِ عن تجاربك، خططك، وآرائك بجمل مترابطة.',lessons:[

      ['الخطط والمستقبل','عبّر عن خططك وتوقّعاتك المستقبلية.','be going to لخطط مقررة. will للتوقعات والقرارات السريعة: I think it will rain.', [['plan','خطة'],['future','مستقبل'],['travel','يسافر'],['probably','على الأرجح']],'لديك خطة مؤكدة للسفر. أكمل: I ___ travel next month.',['am going to','was','have'],0],
      ['المقارنة والتفضيل','قارن بين الأشخاص والأماكن والأشياء.','للصفات القصيرة: taller / the tallest. للصفات الطويلة: more interesting / the most interesting.', [['cheaper','أرخص'],['comfortable','مريح'],['than','من'],['choice','خيار']],'أكمل: This book is ___ than that one.',['interesting','more interesting','most interesting'],1],
      ['التجارب مع present perfect','تحدّث عن تجارب مررت بها دون تحديد وقتها.','have/has + التصريف الثالث. ever للسؤال عن التجارب، و never لنفي تجربة.', [['ever','سبق أن'],['never','أبداً'],['travelled','سافر'],['already','مسبقاً']],'أكمل: Have you ever ___ to London?',['be','been','was'],1],

    ]},
    {id:'B2',name:'فوق المتوسط',en:'Upper intermediate',desc:'تواصل بطلاقة أكبر في العمل والدراسة والنقاشات.',lessons:[

  function allWords(){return lessons.flatMap(l=>l.words.map(w=>({en:w[0],ar:w[1],level:l.level,title:l.title,example:exampleFor(w[0])}))).filter((w,i,a)=>a.findIndex(v=>v.en===w.en)===i)}
  function exampleFor(w){const examples={hello:'Hello, how are you today?',letter:'The letter A is the first letter.',family:'My family lives near the sea.',delicious:'This soup is absolutely delicious.',yesterday:'I called my friend yesterday.',travel:'We travel by train.',opinion:'In my opinion, this is a good idea.',deadline:'The project deadline is Friday.',evidence:'The evidence supports the conclusion.',fluency:'Daily practice helps improve fluency.'};return examples[w]||`I learned the word “${w}” today.`}
  function renderWords(){const words=allWords().filter(w=>(wordLevel==='all'||w.level===wordLevel)&&(`${w.en} ${w.ar} ${w.title}`.toLowerCase().includes(wordQuery.toLowerCase())));const ls=levels.map(l=>`<option value="${l.id}" ${wordLevel===l.id?'selected':''}>${l.id} · ${l.name}</option>`).join('');root.innerHTML=`${head('مفرداتك تكبر كل يوم','مكتبة المفردات','راجع كلمات من الدروس، استمع إلى نطقها، أو اختبر ذاكرتك بالبطاقات.',`<div class="filter-row"><select class="select-control" id="wordLevel">${'<option value="all">كل المستويات</option>'+ls}</select><button class="btn btn-soft" data-action="flash">${icon('cards')} ${flashMode?'القائمة':'بطاقات الحفظ'}</button></div>`)}${flashMode?renderFlash(words):`<div class="words-tools"><label class="word-search">${icon('search')}<input id="wordSearch" value="${escapeHtml(wordQuery)}" placeholder="ابحث بالإنجليزية أو العربية..."></label><span class="date-chip">${words.length} كلمة</span></div><div class="word-grid">${words.length?words.map(w=>`<article class="word-card"><div class="word-card-top"><div class="word-en">${escapeHtml(w.en)}</div><button class="sound-btn" data-speak="${escapeAttr(w.en)}" aria-label="استمع إلى ${escapeAttr(w.en)}">${icon('volume')}</button></div><div class="word-ar">${escapeHtml(w.ar)}</div><div class="word-example">${escapeHtml(w.example)}</div><span class="word-level" style="position:absolute;top:48px;left:13px">${w.level}</span></article>`).join(''):'<div class="empty-state">ما لقينا كلمة بهذا البحث. جرّب كلمة ثانية.</div>'}</div>`}`;const q=$('#wordSearch');if(q)q.addEventListener('input',e=>{wordQuery=e.target.value;const pos=e.target.selectionStart;renderWords();const n=$('#wordSearch');n.focus();n.setSelectionRange(pos,pos)});$('#wordLevel')?.addEventListener('change',e=>{wordLevel=e.target.value;renderWords()})}
  function renderFlash(words){if(!words.length)return '<div class="empty-state">لا توجد كلمات لهذا المستوى.</div>';const w=words[flashIndex%words.length];return `<div class="flash-area"><div class="flash-count">البطاقة ${flashIndex%words.length+1} من ${words.length} · ${w.level}</div><div class="flash-card" data-action="flip"><div class="flash-en">${flashFlipped?escapeHtml(w.ar):escapeHtml(w.en)}</div>${flashFlipped?`<div class="flash-ar">${escapeHtml(w.en)}</div>`:''}<div class="flash-hint">${flashFlipped?'اضغط للعودة للكلمة':'اضغط لإظهار المعنى'}</div></div><div class="flash-controls"><button class="btn btn-plain" data-action="flash-prev">${icon('play')} السابقة</button><button class="btn btn-soft" data-action="flash-flip">${icon('check')} ${flashFlipped?'أعرفها':'أظهر الإجابة'}</button><button class="btn btn-primary" data-action="flash-next">التالية ${icon('play')}</button></div></div><div class="section-row"><span style="font-size:10px;color:var(--muted)">من درس: ${w.title}</span><button class="text-link" data-action="flash-exit">العودة إلى قائمة الكلمات ←</button></div>`}
  let flashFlipped=false;
  function renderPlacement(){if(quizSession?.finished){const res=quizSession;const level=levels[res.level];root.innerHTML=`${head('نتيجتك جاهزة','أحسنت إكمال الاختبار!','هذا تقدير تقريبي لمستواك الحالي، ويمكنك البدء من أي مستوى في المسار.')}<div class="quiz-panel result-card"><div class="result-icon">${icon('award')}</div><div class="result-score">${res.score} / ${res.questions.length}</div><h2>مستواك المقترح: ${level.id} · ${level.name}</h2><p>${level.desc}</p><div style="display:flex;justify-content:center;gap:8px;margin-top:16px"><button class="btn btn-primary" data-action="start-recommended">استعرض المستوى ${level.id}</button><button class="btn btn-plain" data-action="retry-quiz">أعد الاختبار</button></div></div>`;return}if(!quizSession){root.innerHTML=`${head('خطوتك الأولى الصحيحة','اختبار تحديد المستوى','10 أسئلة قصيرة لتقدير نقطة البداية. النتيجة إرشادية ويمكنك تغيير مستواك بأي وقت.')}<div class="quiz-panel" style="text-align:center;padding:40px 20px"><div class="result-icon" style="background:#edf1ff;color:#5e77d6">${icon('target')}</div><h2 style="font-size:19px;margin:8px">أين تبدأ رحلتك؟</h2><p style="font-size:11px;color:var(--muted);max-width:420px;margin:0 auto 16px">يختبر هذا التقييم مفردات وقواعد من مستويات مختلفة. يستغرق نحو 3 دقائق، ولا تحتاج إلى أي تحضير.</p><button class="btn btn-primary" data-action="begin-quiz">ابدأ الاختبار ${icon('play')}</button></div>`;return}const q=quizSession.questions[quizSession.index],answered=quizSession.choice!==null,letters=['A','B','C'];root.innerHTML=`${head('اختبار تحديد المستوى','اختر الإجابة الأنسب','خذ وقتك — لا توجد عقوبة على الإجابة الخاطئة.',`<div class="date-chip">${icon('target')} ${quizSession.index+1} من ${quizSession.questions.length}</div>`)}<div class="quiz-panel"><div class="quiz-top"><span>السؤال ${quizSession.index+1}</span><span>الإجابات الصحيحة: ${quizSession.score}</span></div><div class="quiz-progress"><span style="width:${(quizSession.index+1)/quizSession.questions.length*100}%"></span></div><h2 class="quiz-question">${q.q}</h2><div class="quiz-options">${q.opts.map((o,i)=>`<button class="quiz-option ${answered&&i===q.a?'correct':''} ${answered&&i===quizSession.choice&&i!==q.a?'wrong':''}" data-quiz-answer="${i}" ${answered?'disabled':''}><span class="option-letter">${letters[i]}</span>${o}</button>`).join('')}</div>${answered?`<div class="quiz-feedback">${quizSession.choice===q.a?'أحسنت! ':'الإجابة الصحيحة: '+q.opts[q.a]+' — '}${q.exp}</div>`:''}<div class="quiz-bottom"><small>${quizSession.index+1} / ${quizSession.questions.length}</small>${answered?`<button class="btn btn-primary" data-action="quiz-next">${quizSession.index===quizSession.questions.length-1?'عرض النتيجة':'السؤال التالي'} ${icon('play')}</button>`:'<span style="font-size:10px;color:#9aa5b8">اختر إجابة للمتابعة</span>'}</div></div>`}
  function renderPractice(){const s=scenarios.find(x=>x.id===selectedScenario);root.innerHTML=`${head('استخدم الإنجليزية بصوت عالٍ','تدريب المحادثة','تدرّب على مواقف واقعية. اكتب إجابتك أو استمع إلى نموذج نطق واضح.',`<span class="date-chip">${icon('volume')} النطق يعمل من متصفحك</span>`)}<div class="practice-grid">${scenarios.map(x=>`<div class="scenario-card ${x.id===selectedScenario?'selected':''}" data-scenario="${x.id}"><span class="scenario-emoji">${x.emoji}</span><strong>${x.name}</strong><p>${x.desc}</p></div>`).join('')}</div><section class="practice-workspace"><div class="prompt-box">موقفك اليوم<b>${s.prompt}</b></div><textarea id="practiceAnswer" placeholder="اكتب ردّك باللغة الإنجليزية هنا..."></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-primary" data-action="sample">${icon('star')} ${practiceSample?'إخفاء النموذج':'اعرض نموذج إجابة'}</button><button class="btn btn-plain" data-speak="${escapeAttr(s.sample)}">${icon('volume')} استمع إلى النموذج</button><button class="btn btn-soft" data-action="check-writing">${icon('check')} راجع محاولتي</button></div>${practiceSample?`<div class="answer-sample"><b>${escapeHtml(s.sample)}</b>لاحظ طريقة استخدام عبارات مهذبة وواضحة. حاول بناء إجابتك بطريقتك الخاصة.</div>`:''}<div id="writingFeedback"></div></section><p style="font-size:9px;color:#9aa5b8;margin:10px 3px">التدريب النصي يعمل بالكامل على جهازك. زر الاستماع يستخدم النطق المتاح في متصفحك.</p>`}
  function renderProgress(){const done=state.completed.length,progress=pct(),n=nextLesson();root.innerHTML=`${head('كل خطوة تستحق الاحتفاء','إنجازاتي','تابع تقدمك، احتفل بالعادات التي بنيتها، واستعد للخطوة القادمة.') }<div class="stats-grid"><div class="stat-card"><div class="stat-icon">${icon('check')}</div><div><div class="stat-value">${done}<small style="font-size:10px;color:var(--muted)"> / ${lessons.length}</small></div><div class="stat-label">دروس مكتملة</div></div></div><div class="stat-card"><div class="stat-icon">${icon('clock')}</div><div><div class="stat-value">${state.minutes}<small style="font-size:10px;color:var(--muted)"> دقيقة</small></div><div class="stat-label">وقت التعلّم</div></div></div><div class="stat-card"><div class="stat-icon">${icon('fire')}</div><div><div class="stat-value">${state.streak}<small style="font-size:10px;color:var(--muted)"> يوم</small></div><div class="stat-label">أطول سلسلة حالية</div></div></div><div class="stat-card"><div class="stat-icon">${icon('star')}</div><div><div class="stat-value">${progress}%</div><div class="stat-label">إنجاز المسار</div></div></div></div><div class="progress-overview"><div class="progress-card"><h3>نظرة عامة على رحلتك</h3><div class="big-progress"><div class="ring" style="--progress:${progress*3.6}deg"><b>${progress}%</b></div><div><strong style="font-size:12px">${done===lessons.length?'أكملت المسار كاملاً!':`درسك التالي: ${n.title}`}</strong><p>أنجزت ${done} من أصل ${lessons.length} درساً.</p><button class="text-link" data-action="continue" style="padding:4px 0">${done===lessons.length?'راجع الدروس':'تابع من حيث وصلت'} ←</button></div></div></div><div class="progress-card"><h3>تقدمك حسب المستوى</h3><div class="progress-level-list">${levels.map(l=>{let ls=lessons.filter(x=>x.level===l.id),d=ls.filter(x=>state.completed.includes(x.id)).length;return `<div class="progress-level-row"><span>${l.id}</span><div class="mini-progress"><i style="width:${d/ls.length*100}%"></i></div><small>${d}/${ls.length}</small></div>`}).join('')}</div></div></div><div class="section-row" style="margin-top:18px"><div><h3>إنجازاتك</h3><p>تُفتح الشارات تلقائياً مع تقدّمك</p></div></div><div class="achievement-grid">${[[state.completed.length>=1,'🌱','أول خطوة','أكمل أول درس'],[state.completed.length>=5,'📚','محبّ التعلّم','أكمل 5 دروس'],[state.streak>=3,'🔥','ثلاثة أيام','تعلّم 3 أيام متتالية'],[state.completed.length>=15,'🏅','نصف الطريق','أكمل 15 درساً'],[state.placement!==null,'🎯','اكتشاف المستوى','أكمل اختبار المستوى'],[state.minutes>=60,'⏱️','ساعة كاملة','تعلّم لمدة 60 دقيقة'],[state.completed.length>=30,'👑','متقن','أكمل المسار كاملاً'],[state.streak>=7,'✨','أسبوع من التعلّم','تعلّم 7 أيام متتالية']].map(a=>`<div class="achievement ${a[0]?'earned':''}"><i>${a[1]}</i><strong>${a[2]}</strong><small>${a[3]}</small></div>`).join('')}</div>`}
  function renderSettings(){root.innerHTML=`${head('اجعل التعلّم يناسب يومك','الإعدادات','خصّص هدفك اليومي وإدارة تقدمك المحلي.') }<div class="settings-card"><div class="setting-row"><span class="stat-icon" style="background:#e8f7f2;color:#29a58d">${icon('clock')}</span><div><strong>هدف التعلّم اليومي</strong><small>اختر وقتاً واقعياً تستطيع الالتزام به</small></div><select id="goalSelect"><option value="10" ${state.goal===10?'selected':''}>10 دقائق</option><option value="20" ${state.goal===20?'selected':''}>20 دقيقة</option><option value="30" ${state.goal===30?'selected':''}>30 دقيقة</option><option value="45" ${state.goal===45?'selected':''}>45 دقيقة</option></select></div><div class="setting-row"><span class="stat-icon" style="background:#edf1ff;color:#647cda">${icon('target')}</span><div><strong>اختبار تحديد المستوى</strong><small>${state.placement?`آخر نتيجة: ${levels[state.placement.level].id} · ${state.placement.score}/${state.placement.total}`:'اكتشف نقطة البداية المناسبة لك'}</small></div><button class="btn btn-soft" data-view="placement">${state.placement?'أعد الاختبار':'ابدأ الاختبار'}</button></div><div class="setting-row"><span class="stat-icon" style="background:#fff0ed;color:#da7868">${icon('close')}</span><div><strong>مسح بيانات التعلّم</strong><small>إعادة الدروس والإنجازات إلى البداية على هذا الجهاز</small></div><button class="danger-btn" data-action="reset">إعادة التقدّم</button></div></div><p style="font-size:10px;color:var(--muted);margin:12px 5px">تُحفظ إنجازاتك محلياً في هذا المتصفح ولا تحتاج إلى إنشاء حساب.</p>`;$('#goalSelect').addEventListener('change',e=>{state.goal=+e.target.value;save();toast(`تم تحديث هدفك إلى ${state.goal} دقيقة يومياً`);render()})}
  function openLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;if(!isUnlocked(l)){toast('أكمل الدروس السابقة لفتح هذا الدرس');return}activeLesson=l;lessonAnswered=false;renderLessonModal()}
  function renderLessonModal(answer=null){const l=activeLesson;if(!l)return;$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><span class="level-chip">${l.level}</span><div><h2 id="modalTitle">${l.title}</h2><p>الدرس ${l.index} · ${l.levelName}</p></div><button class="modal-close" data-action="close-modal" aria-label="إغلاق">${icon('close',17)}</button></header><div class="modal-body"><p class="lesson-section-title">مفردات الدرس</p><div class="lesson-vocab">${l.words.map(w=>`<div class="lesson-vocab-item"><div><b>${escapeHtml(w[0])}</b><small>${escapeHtml(w[1])}</small></div><button class="sound-btn" data-speak="${escapeAttr(w[0])}">${icon('volume')}</button></div>`).join('')}</div><p class="lesson-section-title">قاعدة وملاحظة</p><div class="grammar-box"><b>تذكّر: </b>${l.grammar}</div><div class="lesson-quiz"><h3>${l.question}</h3>${l.options.map((o,i)=>`<button class="lesson-opt ${answer===l.answer&&i===l.answer?'correct':''} ${answer===i&&i!==l.answer?'wrong':''}" data-lesson-answer="${i}" ${answer===l.answer?'disabled':''}>${o}</button>`).join('')}${answer!==null?`<div class="quiz-feedback">${answer===l.answer?'إجابة صحيحة، رائع! أكمل إلى الدرس التالي.':'ليست هذه الإجابة. راجع القاعدة وحاول مرة أخرى.'}</div>`:''}</div></div><footer class="modal-foot"><small>${state.completed.includes(l.id)?'أنهيت هذا الدرس سابقاً':answer===l.answer?'أحسنت! أصبح بإمكانك فتح الدرس التالي.':'اختر إجابة صحيحة لإنهاء الدرس'}</small>${state.completed.includes(l.id)||answer===l.answer?`<button class="btn btn-primary" data-action="complete-lesson">${state.completed.includes(l.id)?'إغلاق الدرس':'إنهاء الدرس'} ${icon('check')}</button>`:''}</footer></section></div>`;}
  function completeLesson(){if(!activeLesson)return;const l=activeLesson;if(!state.completed.includes(l.id)){state.completed.push(l.id);state.minutes+=5;const today=dayKey();const yesterday=dayKey(new Date(Date.now()-86400000));if(state.lastStudy!==today){state.streak=state.lastStudy===yesterday?state.streak+1:1;state.lastStudy=today}let day=state.studyDays.find(x=>x.date===today);if(day)day.minutes+=5;else state.studyDays.push({date:today,minutes:5});save()}$('#modalRoot').innerHTML='';activeLesson=null;toast('أحسنت! تم تسجيل إكمال الدرس 🎉');render()}
  function beginQuiz(){quizSession={questions:[...quizBank].sort(()=>Math.random()-.5).slice(0,10),index:0,score:0,choice:null,finished:false}}
  function quizAnswer(i){if(!quizSession||quizSession.choice!==null)return;quizSession.choice=i;if(i===quizSession.questions[quizSession.index].a)quizSession.score++;renderPlacement()}
  function quizNext(){if(quizSession.index<quizSession.questions.length-1){quizSession.index++;quizSession.choice=null}else{quizSession.finished=true;const ratio=quizSession.score/quizSession.questions.length;const idx=ratio<.2?0:ratio<.38?1:ratio<.56?2:ratio<.73?3:ratio<.9?4:5;quizSession.level=idx;state.placement={level:idx,score:quizSession.score,total:quizSession.questions.length};save()}renderPlacement()}
  function speak(text){if(!('speechSynthesis'in window)){toast('النطق غير مدعوم في هذا المتصفح');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;')}
  document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return}const nav=e.target.closest('.nav-link[data-view]');if(nav){setView(nav.dataset.view);return}const lesson=e.target.closest('[data-lesson]');if(lesson){openLesson(lesson.dataset.lesson);return}const lv=e.target.closest('[data-level]');if(lv){expandedLevel=expandedLevel===lv.dataset.level?'':lv.dataset.level;renderCourse();return}const speakBtn=e.target.closest('[data-speak]');if(speakBtn){speak(speakBtn.dataset.speak);return}const la=e.target.closest('[data-lesson-answer]');if(la){lessonAnswered=+la.dataset.lessonAnswer;renderLessonModal(lessonAnswered);return}const qa=e.target.closest('[data-quiz-answer]');if(qa){quizAnswer(+qa.dataset.quizAnswer);return}const scen=e.target.closest('[data-scenario]');if(scen){selectedScenario=scen.dataset.scenario;practiceSample=false;renderPractice();return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case'continue':openLesson(nextLesson().id);break;case'close-modal':$('#modalRoot').innerHTML='';activeLesson=null;break;case'backdrop':if(e.target.classList.contains('modal-backdrop')){$('#modalRoot').innerHTML='';activeLesson=null}break;case'complete-lesson':completeLesson();break;case'flash':flashMode=!flashMode;flashFlipped=false;renderWords();break;case'flash-exit':flashMode=false;renderWords();break;case'flash-flip':flashFlipped=!flashFlipped;renderWords();break;case'flip':flashFlipped=!flashFlipped;renderWords();break;case'flash-next':flashIndex++;flashFlipped=false;renderWords();break;case'flash-prev':flashIndex=Math.max(0,flashIndex-1);flashFlipped=false;renderWords();break;case'begin-quiz':beginQuiz();renderPlacement();break;case'quiz-next':quizNext();break;case'retry-quiz':quizSession=null;renderPlacement();break;case'start-recommended':expandedLevel=levels[quizSession.level].id;quizSession=null;setView('course');break;case'sample':practiceSample=!practiceSample;renderPractice();break;case'check-writing':{const txt=$('#practiceAnswer').value.trim();const feedback=$('#writingFeedback');if(!txt){toast('اكتب إجابتك أولاً ثم راجعها');break}const words=txt.split(/\s+/).filter(Boolean).length;feedback.innerHTML=`<div class="answer-sample"><b>${words>=8?'بداية جيدة!':'أضف تفصيلاً آخر لتصبح إجابتك أوضح.'}</b>كتبت ${words} كلمة. اقرأ إجابتك بصوت عالٍ، وتحقق من ترتيب الكلمات والنقطة في نهاية الجملة. قارنها بالنموذج إذا أردت.</div>`;break}case'reset':if(confirm('هل تريد إعادة كل الدروس والإنجازات إلى البداية؟')){state={...defaults};save();quizSession=null;toast('تمت إعادة التقدّم');render()}break}}
  );
  document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){wordQuery=e.target.value;wordLevel='all';setView('words');const q=$('#wordSearch');if(q){q.value=wordQuery;q.focus();q.setSelectionRange(wordQuery.length,wordQuery.length)}}});
  $('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#notifBtn').addEventListener('click',()=>toast(`هدفك اليومي ${state.goal} دقيقة. ${state.minutes?`تعلّمت ${state.minutes} دقيقة حتى الآن.`:'ابدأ بدرس قصير اليوم!'}`));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeLesson){$('#modalRoot').innerHTML='';activeLesson=null}if(e.key==='Escape')$('#sidebar').classList.remove('open')});
  updateSidebar();render();
})();
</script>
